<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nail Streak">
<meta name="theme-color" content="#0a0a0f">
<title>Nail Streak</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #18181f;
    --border: #2a2a38;
    --accent: #7fff6e;
    --accent-dim: #4aff3a40;
    --accent-glow: #7fff6e60;
    --red: #ff4f4f;
    --text: #f0f0f8;
    --muted: #6b6b88;
    --gold: #ffd84a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Animated grain background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  .app {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
    padding: 0 20px;
    padding-top: max(env(safe-area-inset-top), 48px);
    max-width: 430px;
    margin: 0 auto;
    width: 100%;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .logo span {
    color: var(--accent);
  }

  .settings-btn {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
  }
  .settings-btn:active { transform: scale(0.93); background: var(--border); }

  /* Main streak display */
  .streak-hero {
    text-align: center;
    margin-bottom: 28px;
  }

  .streak-ring-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
  }

  .streak-ring {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(ellipse at center, #1a1a28 0%, var(--card) 70%);
    box-shadow: 0 0 60px #7fff6e18, inset 0 0 30px #00000040;
    transition: box-shadow 0.5s;
  }

  .streak-ring.active {
    box-shadow: 0 0 80px var(--accent-glow), 0 0 30px var(--accent-dim), inset 0 0 20px #7fff6e08;
    border-color: var(--accent);
  }

  .streak-ring svg.ring-svg {
    position: absolute;
    inset: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    transform: rotate(-90deg);
  }

  .ring-track { fill: none; stroke: var(--border); stroke-width: 3; }
  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 6px var(--accent));
  }

  .streak-number {
    font-size: 58px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    color: var(--accent);
    text-shadow: 0 0 30px var(--accent-glow);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .streak-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  .streak-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .streak-subtitle {
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .streak-subtitle span {
    color: var(--gold);
  }

  /* Today check-in */
  .checkin-section {
    margin-bottom: 24px;
  }

  .checkin-btn {
    width: 100%;
    padding: 20px;
    border-radius: 18px;
    border: 2px solid var(--border);
    background: var(--card);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .checkin-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-dim) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .checkin-btn.done {
    border-color: var(--accent);
    background: #151f14;
  }

  .checkin-btn.done::before { opacity: 1; }

  .checkin-btn:active:not(.done) { transform: scale(0.97); }

  .checkin-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    transition: all 0.3s;
    position: relative;
    z-index: 1;
  }

  .checkin-btn.done .checkin-icon {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }

  .checkin-text { flex: 1; text-align: left; position: relative; z-index: 1; }
  .checkin-text strong {
    display: block;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .checkin-text small {
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .checkin-btn.done .checkin-text strong { color: var(--accent); }

  .checkin-arrow {
    font-size: 18px;
    color: var(--muted);
    position: relative;
    z-index: 1;
    transition: transform 0.3s;
  }
  .checkin-btn.done .checkin-arrow { color: var(--accent); transform: rotate(0deg); }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    transition: border-color 0.3s;
  }

  .stat-card:first-child { border-color: var(--gold)30; }

  .stat-icon { font-size: 20px; margin-bottom: 8px; }
  .stat-value {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-card:first-child .stat-value { color: var(--gold); }
  .stat-name {
    font-size: 11px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
  }

  /* Calendar */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 14px;
  }

  .calendar-section { margin-bottom: 28px; }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .cal-day-name {
    text-align: center;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    padding: 4px 0;
    letter-spacing: 0.05em;
  }

  .cal-day {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'JetBrains Mono', monospace;
    position: relative;
  }

  .cal-day.success {
    background: #152012;
    border-color: var(--accent)60;
    color: var(--accent);
  }

  .cal-day.success::after {
    content: '';
    position: absolute;
    inset: 2px;
    border-radius: 6px;
    background: radial-gradient(circle, var(--accent)20 0%, transparent 70%);
  }

  .cal-day.fail {
    background: #201212;
    border-color: var(--red)50;
    color: var(--red);
  }

  .cal-day.today {
    border-color: var(--text)80;
    color: var(--text);
    font-weight: 800;
  }

  .cal-day.today.success {
    border-color: var(--accent);
  }

  .cal-day.future {
    opacity: 0.25;
    cursor: default;
  }

  .cal-day.empty {
    background: transparent;
    border-color: transparent;
    cursor: default;
  }

  /* Notification section */
  .notif-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .notif-card:active { transform: scale(0.98); }

  .notif-icon {
    font-size: 28px;
    flex-shrink: 0;
  }

  .notif-text { flex: 1; }
  .notif-text strong { font-size: 14px; font-weight: 700; display: block; margin-bottom: 3px; }
  .notif-text small { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  .notif-toggle {
    width: 44px;
    height: 26px;
    border-radius: 13px;
    background: var(--border);
    position: relative;
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .notif-toggle.on { background: var(--accent); }
  .notif-toggle::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .notif-toggle.on::after { transform: translateX(18px); }

  /* Confetti burst */
  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #0a0a0f;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 100px;
    z-index: 1000;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    opacity: 0;
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
  }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Bounce animation on streak number */
  @keyframes bounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    70% { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  .bounce { animation: bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

  /* Motivational banner */
  .motivation {
    background: linear-gradient(135deg, #1a1f14, #141a1a);
    border: 1px solid var(--accent)30;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 24px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    text-align: center;
    letter-spacing: 0.01em;
  }

  .motivation::before {
    content: '💬 ';
  }

  /* PWA install hint */
  .install-hint {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.6;
    text-align: center;
    display: none;
  }

  .install-hint.show { display: block; }
  .install-hint strong { color: var(--text); }
</style>
</head>
<body>

<div class="confetti-container" id="confettiContainer"></div>
<div class="toast" id="toast"></div>

<div class="app">
  <header class="header">
    <div class="logo">nail<span>streak</span></div>
    <button class="settings-btn" onclick="toggleInstallHint()">📱</button>
  </header>

  <!-- Install hint -->
  <div class="install-hint" id="installHint">
    <strong>Zum Homescreen hinzufügen:</strong><br>
    Safari → Teilen-Symbol → "Zum Home-Bildschirm"<br>
    Danach wie eine echte App nutzbar! 🎉
  </div>

  <!-- Streak ring -->
  <section class="streak-hero">
    <div class="streak-ring-wrap">
      <div class="streak-ring" id="streakRing">
        <svg class="ring-svg" viewBox="0 0 192 192">
          <circle class="ring-track" cx="96" cy="96" r="90"/>
          <circle class="ring-progress" id="ringProgress" cx="96" cy="96" r="90"
            stroke-dasharray="565"
            stroke-dashoffset="565"/>
        </svg>
        <div class="streak-number" id="streakNumber">0</div>
        <div class="streak-label">Tage</div>
      </div>
    </div>
    <div class="streak-title" id="streakTitle">Dein Streak</div>
    <div class="streak-subtitle" id="streakSubtitle">Fang heute an! 💪</div>
  </section>

  <!-- Motivation -->
  <div class="motivation" id="motivationBanner">Heute ist der perfekte Tag anzufangen!</div>

  <!-- Check-in -->
  <section class="checkin-section">
    <button class="checkin-btn" id="checkinBtn" onclick="handleCheckin()">
      <div class="checkin-icon" id="checkinIcon">🤚</div>
      <div class="checkin-text">
        <strong id="checkinTitle">Heute eintragen</strong>
        <small id="checkinSub">Hast du heute nicht gekaut?</small>
      </div>
      <div class="checkin-arrow" id="checkinArrow">→</div>
    </button>
  </section>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon">🏆</div>
      <div class="stat-value" id="bestStreak">0</div>
      <div class="stat-name">Best Streak</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📅</div>
      <div class="stat-value" id="totalDays">0</div>
      <div class="stat-name">Gesamt Tage</div>
    </div>
  </div>

  <!-- Calendar -->
  <section class="calendar-section">
    <div class="section-title">Dieser Monat</div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </section>

  <!-- Notifications -->
  <div class="notif-card" id="notifCard" onclick="toggleNotifications()">
    <div class="notif-icon">🔔</div>
    <div class="notif-text">
      <strong>Abend-Erinnerung</strong>
      <small id="notifStatus">20:00 Uhr täglich</small>
    </div>
    <div class="notif-toggle" id="notifToggle"></div>
  </div>
</div>

<script>
// ===================== STATE =====================
const STORAGE_KEY = 'nailstreak_v1';

function loadState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      days: {},       // { "2025-04-28": true/false }
      notifEnabled: false,
      notifHour: 20,
      lastNotifScheduled: null
    };
  } catch { return { days: {}, notifEnabled: false, notifHour: 20 }; }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

// ===================== DATE UTILS =====================
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function dateKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

// ===================== STREAK CALC =====================
function calcStreak() {
  let streak = 0;
  const today = new Date();

  // If today is already checked, include it
  let check = new Date(today);
  const todayK = todayKey();

  // Walk backwards from today
  if (!state.days[todayK]) {
    // Not checked today: check yesterday and before
    check.setDate(check.getDate() - 1);
  }

  for (let i = 0; i < 10000; i++) {
    const k = dateKey(check);
    if (state.days[k] === true) {
      streak++;
      check.setDate(check.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function calcBestStreak() {
  const keys = Object.keys(state.days).filter(k => state.days[k]).sort();
  if (!keys.length) return 0;

  let best = 1, cur = 1;
  for (let i = 1; i < keys.length; i++) {
    const prev = new Date(keys[i-1]);
    const curr = new Date(keys[i]);
    const diff = (curr - prev) / 86400000;
    if (diff === 1) { cur++; if (cur > best) best = cur; }
    else { cur = 1; }
  }
  return best;
}

function calcTotal() {
  return Object.values(state.days).filter(Boolean).length;
}

// ===================== MOTIVATIONS =====================
const MOTIVATIONS = [
  "Nägel kauen ist gestern. Du bist stärker! 💪",
  "Jeder Tag zählt – bleib bei dir! 🔥",
  "Deine Hände sagen Danke! 🙌",
  "Gewohnheiten bauen braucht Zeit – du schaffst das!",
  "Heute wieder ein Sieg über dich selbst! ✅",
  "Gesunde Nägel, gesundes Mindset! 🧠",
  "Ein Tag nach dem anderen – das ist der Weg! 🛤️",
  "Streaks sind Magie aus Disziplin! ✨",
  "Dein zukünftiges Ich wird es dir danken! 🚀",
  "Stärker als der Drang – immer! 💥"
];

function getMotivation(streak) {
  if (streak === 0) return "Heute ist der perfekte Tag anzufangen!";
  if (streak === 1) return "Erster Tag geschafft – der Anfang ist gemacht! 🎉";
  if (streak >= 7) return `${streak} Tage – du bist eine absolute Maschine! 🔥`;
  if (streak >= 3) return `${streak} Tage am Stück – krass! 💪`;
  return MOTIVATIONS[streak % MOTIVATIONS.length];
}

function getSubtitle(streak) {
  if (streak === 0) return "Starte deinen Streak heute!";
  if (streak === 1) return "🌱 Tag 1 – der wichtigste";
  if (streak < 7) return `${7 - streak} Tage bis zur 1-Wochen-Marke ⭐`;
  if (streak < 30) return `${30 - streak} Tage bis zum Monats-Badge 🥇`;
  const best = calcBestStreak();
  return streak === best ? `🏆 Neuer Rekord!` : `Best: ${best} Tage`;
}

// ===================== RENDER =====================
function render() {
  const streak = calcStreak();
  const best = Math.max(calcBestStreak(), streak);
  const total = calcTotal();
  const today = todayKey();
  const todayDone = state.days[today] === true;

  // Streak number
  document.getElementById('streakNumber').textContent = streak;

  // Ring progress (max visual at 30 days)
  const circumference = 565;
  const progress = Math.min(streak / 30, 1);
  const offset = circumference - (circumference * progress);
  document.getElementById('ringProgress').style.strokeDashoffset = offset;

  // Ring glow
  const ring = document.getElementById('streakRing');
  ring.classList.toggle('active', streak > 0);

  // Title & subtitle
  document.getElementById('streakTitle').textContent = streak > 0 ? `${streak} Tage 🔥` : 'Dein Streak';
  document.getElementById('streakSubtitle').innerHTML = getSubtitle(streak);

  // Motivation
  document.getElementById('motivationBanner').textContent = getMotivation(streak);

  // Check-in button
  const btn = document.getElementById('checkinBtn');
  const icon = document.getElementById('checkinIcon');
  const title = document.getElementById('checkinTitle');
  const sub = document.getElementById('checkinSub');
  const arrow = document.getElementById('checkinArrow');

  if (todayDone) {
    btn.classList.add('done');
    icon.textContent = '✅';
    title.textContent = 'Heute geschafft!';
    sub.textContent = 'Super – komm morgen wieder';
    arrow.textContent = '✓';
  } else {
    btn.classList.remove('done');
    icon.textContent = '🤚';
    title.textContent = 'Heute eintragen';
    sub.textContent = 'Hast du heute nicht gekaut?';
    arrow.textContent = '→';
  }

  // Stats
  document.getElementById('bestStreak').textContent = best;
  document.getElementById('totalDays').textContent = total;

  // Notifications
  const toggle = document.getElementById('notifToggle');
  toggle.classList.toggle('on', state.notifEnabled);
  document.getElementById('notifStatus').textContent = state.notifEnabled
    ? `✅ Aktiv – täglich um ${state.notifHour}:00 Uhr`
    : `Tippe um zu aktivieren`;

  // Calendar
  renderCalendar();
}

function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const today = now.getDate();

  // Day names
  const dayNames = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  dayNames.forEach(n => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    el.textContent = n;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1);
  // Monday-based: 0=Mon, 6=Sun
  let startDow = firstDay.getDay() - 1;
  if (startDow < 0) startDow = 6;

  // Empty cells
  for (let i = 0; i < startDow; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    el.textContent = d;

    const classes = ['cal-day'];
    if (d === today) classes.push('today');
    if (d > today) classes.push('future');
    else if (state.days[key] === true) classes.push('success');
    else if (state.days[key] === false) classes.push('fail');

    el.className = classes.join(' ');
    grid.appendChild(el);
  }
}

// ===================== CHECK-IN =====================
function handleCheckin() {
  const today = todayKey();
  if (state.days[today]) {
    showToast('Heute schon eingetragen! ✅');
    return;
  }

  state.days[today] = true;
  saveState(state);

  // Animate number
  const num = document.getElementById('streakNumber');
  num.classList.remove('bounce');
  void num.offsetWidth;
  num.classList.add('bounce');

  const streak = calcStreak();
  showConfetti();

  if (streak > 0 && streak % 7 === 0) {
    showToast(`🔥 ${streak} Tage – Wahnsinn!`);
  } else {
    showToast('Nice! Heute geschafft 💪');
  }

  render();
}

// ===================== CONFETTI =====================
function showConfetti() {
  const container = document.getElementById('confettiContainer');
  container.innerHTML = '';
  const colors = ['#7fff6e', '#ffd84a', '#ff4f4f', '#7eb8ff', '#ff8de8'];

  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left: ${Math.random() * 100}%;
      top: -10px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      width: ${4 + Math.random() * 8}px;
      height: ${4 + Math.random() * 8}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      animation-duration: ${1.5 + Math.random() * 2}s;
      animation-delay: ${Math.random() * 0.5}s;
    `;
    container.appendChild(el);
  }
  setTimeout(() => container.innerHTML = '', 4000);
}

// ===================== TOAST =====================
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ===================== NOTIFICATIONS (PWA) =====================
async function toggleNotifications() {
  if (!('Notification' in window)) {
    showToast('Bitte als PWA installieren für Benachrichtigungen!');
    document.getElementById('installHint').classList.add('show');
    return;
  }

  if (state.notifEnabled) {
    state.notifEnabled = false;
    saveState(state);
    render();
    showToast('Erinnerung deaktiviert');
    return;
  }

  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    state.notifEnabled = true;
    saveState(state);
    scheduleNotification();
    render();
    showToast('🔔 Erinnerung aktiviert!');
  } else {
    showToast('Bitte Benachrichtigungen erlauben 🙏');
    if (perm === 'denied') {
      showToast('In Safari-Einstellungen erlauben');
    }
  }
}

function scheduleNotification() {
  if (!state.notifEnabled) return;
  if (!('serviceWorker' in navigator)) return;

  const now = new Date();
  const target = new Date();
  target.setHours(state.notifHour, 0, 0, 0);

  if (target <= now) target.setDate(target.getDate() + 1);
  const delay = target - now;

  // Store next scheduled time
  state.lastNotifScheduled = target.toISOString();
  saveState(state);

  setTimeout(() => {
    if (!state.notifEnabled) return;
    new Notification('Nail Streak 🤚', {
      body: calcStreak() > 0
        ? `Streak: ${calcStreak()} Tage! Hast du heute nicht gekaut? Trag es ein! 💪`
        : 'Hast du heute deine Nägel in Ruhe gelassen? Trag es ein! 🌟',
      icon: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIwIiBmaWxsPSIjN2ZmZjZlIi8+PHRleHQgeT0iLjllbSIgZm9udC1zaXplPSI4MCIgeD0iMTAiPvCfpKo8L3RleHQ+PC9zdmc+',
      badge: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIwIiBmaWxsPSIjN2ZmZjZlIi8+PC9zdmc+',
      tag: 'nail-streak-daily',
      renotify: true
    });
    // Schedule next day
    setTimeout(scheduleNotification, 1000);
  }, delay);
}

// ===================== HELPERS =====================
function toggleInstallHint() {
  const hint = document.getElementById('installHint');
  hint.classList.toggle('show');
}

// ===================== INIT =====================
window.addEventListener('DOMContentLoaded', () => {
  render();

  // Re-schedule notification if was enabled
  if (state.notifEnabled && 'Notification' in window && Notification.permission === 'granted') {
    scheduleNotification();
  }

  // Show install hint on first visit if not in standalone
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (!isStandalone && !localStorage.getItem('hint_dismissed')) {
    setTimeout(() => {
      document.getElementById('installHint').classList.add('show');
    }, 1500);
  }
});
</script>
